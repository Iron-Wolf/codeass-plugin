<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="40" height="40">
    <defs>
        <!-- Dégradé du fond (Style IntelliJ Dark) -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1f22" />
            <stop offset="100%" stop-color="#121214" />
        </linearGradient>

        <!-- Dégradé Néon JetBrains (Rose -> Violet -> Bleu) -->
        <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FE2857" />
            <stop offset="50%" stop-color="#B134EB" />
            <stop offset="100%" stop-color="#3982FC" />
        </linearGradient>

        <!-- Dégradé de la pièce centrale -->
        <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d2f34" />
            <stop offset="100%" stop-color="#1a1b1d" />
        </linearGradient>

        <!-- Effet de lueur (Glow) pour la jauge -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Base de l'icône (Carré aux bords très arrondis, style icône d'application) -->
    <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#2b2d30" stroke-width="4"/>

    <!-- Jauge de Crédits (Arc de cercle représentant le quota restant) -->
    <path d="M 143 369 A 160 160 0 1 1 369 369"
          fill="none"
          stroke="url(#accent-grad)"
          stroke-width="26"
          stroke-linecap="round"
          filter="url(#glow)" />

    <!-- Petit indicateur lumineux au bout de la jauge -->
    <circle cx="369" cy="369" r="13" fill="#3982FC" filter="url(#glow)" />

    <!-- Pièce de monnaie centrale (Token) -->
    <circle cx="256" cy="256" r="100" fill="url(#coin-grad)" stroke="#3a3c42" stroke-width="6" />

    <!-- Grande Étincelle IA (LLM) -->
    <path d="M230,190 Q230,240 280,240 Q230,240 230,290 Q230,240 180,240 Q230,240 230,190 Z"
          fill="url(#accent-grad)" />

    <!-- Petite Étincelle IA secondaire -->
    <path d="M295,260 Q295,285 320,285 Q295,285 295,310 Q295,285 270,285 Q295,285 295,260 Z"
          fill="#ffffff"
          opacity="0.9" />
</svg>
